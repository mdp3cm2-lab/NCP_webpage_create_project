media:
  input: public/uploads
  output: /uploads
  rename: safe
  categories: [image]

content:
  - name: news
    label: NEWS
    type: collection
    path: content/news
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      primary: title
      fields: [date, published]
      sort: date
      order: desc
    fields:
      - name: title
        label: タイトル
        type: string
        required: true
      - name: slug
        label: URL名
        type: string
        required: true
        description: 半角英数字とハイフンを推奨します
      - name: date
        label: 公開日
        type: date
        required: true
      - name: published
        label: 公開する
        type: boolean
        default: true
      - name: excerpt
        label: 一覧用の説明
        type: text
        options:
          maxlength: 240
      - name: image
        label: メイン画像
        type: image
      - name: body
        label: 本文
        type: rich-text
        options:
          format: html
          media: true
          path: articles
          rename: safe

  - name: topics
    label: TOPIC
    type: collection
    path: content/topics
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      primary: title
      fields: [date, published]
      sort: date
      order: desc
    fields:
      - name: title
        label: タイトル
        type: string
        required: true
      - name: slug
        label: URL名
        type: string
        required: true
        description: 半角英数字とハイフンを推奨します
      - name: date
        label: 公開日
        type: date
        required: true
      - name: published
        label: 公開する
        type: boolean
        default: true
      - name: excerpt
        label: 一覧用の説明
        type: text
        options:
          maxlength: 240
      - name: image
        label: メイン画像
        type: image
      - name: body
        label: 本文
        type: rich-text
        options:
          format: html
          media: true
          path: articles
          rename: safe

  - name: site
    label: サイト基本情報
    type: file
    path: content/site.yml
    fields:
      - name: site_name
        label: サイト名
        type: string
      - name: description
        label: サイト説明
        type: text
      - name: event_title
        label: トップの大会名
        type: string
      - name: event_date
        label: トップの大会日
        type: string
      - name: event_place
        label: トップの会場
        type: string
      - name: event_link
        label: 詳細記事URL
        type: string
      - name: instagram_url
        label: Instagram URL
        type: string
      - name: youtube_url
        label: YouTube URL
        type: string
      - name: contact_email
        label: 問い合わせ先メール
        type: string

settings:
  content:
    merge: true
  commit:
    message: "サイト更新: {name}"

